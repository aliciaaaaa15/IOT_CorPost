services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: corpost
      POSTGRES_PASSWORD: corpost
      POSTGRES_DB: corpost
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpost -d corpost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      # Inside the Compose network the database is called "db", not "localhost".
      # "environment" takes precedence over env_file, so the same .env works locally and in Docker.
      DATABASE_URL: postgresql+psycopg://corpost:corpost@db:5432/corpost
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
