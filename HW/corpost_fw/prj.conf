# Sensor and actuator bus
CONFIG_I2C=y
# DK buttons (1: recalibrate, 2: delete pairing)
CONFIG_GPIO=y
# Hardware floating-point calculations (Cortex-M4F)
CONFIG_FPU=y

# RTT console (J-Link)
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# Packet CRC-16
CONFIG_CRC=y

# ---------------------------------------------------------------------------
# Bluetooth Low Energy: peripheral (GAP) and GATT server
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CorPost"
CONFIG_BT_MAX_CONN=1

# Preferred connection parameters (the phone decides; the nRF requests them after 5 s)
#   interval 100-200 ms (units of 1.25 ms), latency 4, timeout 4 s (units of 10 ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# MTU: the packet is 24 B and the default MTU (23) leaves only 20 B of data.
# On connection the nRF requests an MTU of 247 (the phone answers with its own).
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# (Data Length Extension is already 251 by default in the Nordic controller:
#  the packet travels in a single radio frame)

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# Pairing: LE Secure Connections only (ECDH P-256 + AES-CCM 128) and
# authenticated (level 4). "Legacy" and "Just Works" pairing are rejected.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
# Bonding: the keys are stored in flash.
# Up to 3 paired phones. With a single slot, a second phone cannot pair:
# bt_conn_set_security returns -ENOMEM and the passkey is never shown.
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=3
# Privacy: random address that changes (RPA), so the device cannot be tracked
# TEST Android 14 (error 135): privacy temporarily disabled
# CONFIG_BT_PRIVACY=y

# Persistent storage of the bonds (settings over NVS in flash)
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
