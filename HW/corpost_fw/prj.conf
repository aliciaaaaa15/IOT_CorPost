# Bus de sensores y actuador
CONFIG_I2C=y
# Botones del DK (1: recalibrar, 2: borrar emparejamiento)
CONFIG_GPIO=y
# Cálculos en coma flotante por hardware (Cortex-M4F)
CONFIG_FPU=y

# Consola por RTT (J-Link)
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# CRC-16 del paquete
CONFIG_CRC=y

# ---------------------------------------------------------------------------
# Bluetooth Low Energy: periférico (GAP) y servidor GATT
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CorPost"
CONFIG_BT_MAX_CONN=1

# Parámetros de conexión preferidos (el móvil decide; el nRF los pide a los 5 s)
#   intervalo 100-200 ms (unidades de 1,25 ms), latencia 4, timeout 4 s (unidades de 10 ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# MTU: el paquete es de 24 B y el MTU por defecto (23) solo deja 20 B de datos.
# El nRF pide al conectar un MTU de 247 (el móvil responde con el suyo).
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# (Data Length Extension ya viene a 251 por defecto en el controlador de Nordic:
#  el paquete viaja en una sola trama de radio)

# ---------------------------------------------------------------------------
# Seguridad
# ---------------------------------------------------------------------------
# Emparejamiento: solo LE Secure Connections (ECDH P-256 + AES-CCM 128) y
# autenticado (nivel 4). Se rechaza el emparejamiento "legacy" y el "Just Works".
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
# Bonding: las claves se guardan en flash.
# PRUEBA: hasta 3 móviles emparejados (antes 1). Con 1, un segundo móvil no podía
# emparejarse: bt_conn_set_security devolvía -ENOMEM y nunca salía el passkey.
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=3
# Privacidad: dirección aleatoria que cambia (RPA), para que no se pueda rastrear
# PRUEBA Android 14 (error 135): privacidad desactivada temporalmente
# CONFIG_BT_PRIVACY=y

# Almacenamiento persistente de los bonds (settings sobre NVS en flash)
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
